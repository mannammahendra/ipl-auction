version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: ipl_postgres
    restart: always
    environment:
      POSTGRES_USER: ipl_user
      POSTGRES_PASSWORD: ipl_secure_password_2026
      POSTGRES_DB: ipl_auction
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: ipl_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ipl_backend
    restart: always
    ports:
      - "4000:4000"
    environment:
      PORT: 4000
      DATABASE_URL: "file:./dev.db" # Or postgresql://ipl_user:ipl_secure_password_2026@postgres:5432/ipl_auction
      JWT_SECRET: "ipl-mega-auction-jwt-secret-key-998877"
      FRONTEND_URL: "http://localhost:3000"
      REDIS_URL: ""
    depends_on:
      - postgres
      - redis

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ipl_frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: "http://localhost:4000"
      NEXT_PUBLIC_SOCKET_URL: "http://localhost:4000"
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
